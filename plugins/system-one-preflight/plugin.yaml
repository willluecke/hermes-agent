name: system-one-preflight
version: "0.1.0"
description: "Ask TypeSafe's Jev decision model one calibrated question per turn: does the active request need evidence the agent has not checked yet? Shadow mode logs the verdict beside what the model then did; jev mode inserts a fixed verification reminder above a threshold; always mode inserts it every turn; trial mode assigns each session to control, always, or jev for a three-arm comparison. Also shadow-classifies terminal and file-write calls (deletion, privilege change, external disclosure, shared-system change, within the user's established scope) without ever blocking. Before a turn that edited files finishes, judges the diff against the model's own acceptance-criteria todos, the matching .devproject features, an evidence ledger built by code from every command the turn ran (exit code, runner summary, workspace digest, retained output) and the result manifest the model registers with report_results, whose claims code checks exactly and the gate re-runs when stale; keeps the model going when a criterion is confidently unmet, a claim is contradicted, or a build turn that ran checks registered no manifest. When criteria are registered, judges each against the request and drops the ones the request does not entail; steers the model once when the set does not cover the request."
author: "Will Luecke"
requires_env:
  - TYPESAFE_API_KEY
hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_verify
